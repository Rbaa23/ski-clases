<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a1628" />
<title>Contacto · StatClass</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0a1628;
    color: #e8f4f8;
  }
  .card { width: 100%; max-width: 380px; text-align: center; }
  .avatar {
    width: 96px; height: 96px; border-radius: 50%; margin: 0 auto 18px; overflow: hidden;
    border: 2px solid rgba(255,255,255,0.24); box-shadow: 0 8px 30px rgba(0,0,0,0.45);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: 0.3px; }
  .sub { margin: 6px 0 26px; font-size: 14px; color: #90CAF9; letter-spacing: 0.5px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    width: 100%; padding: 18px; margin-bottom: 14px; border: none; border-radius: 16px;
    font-size: 17px; font-weight: 700; color: #fff; text-decoration: none;
    font-family: inherit; cursor: pointer; transition: transform 0.08s ease, box-shadow 0.2s ease;
    box-shadow: 0 10px 24px rgba(0,0,0,0.35);
  }
  .btn:active { transform: scale(0.97); }
  .btn svg { width: 26px; height: 26px; flex-shrink: 0; }
  .btn-ig { margin-top: 56px; background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
  .btn-wa { background: #25D366; }
  .btn-wa svg { fill: #075E54; }
  .btn-ig svg { fill: #fff; }
  .foot { margin-top: 22px; font-size: 12px; color: #ffffff; }
  .err-card {
    width: 100%; max-width: 380px; text-align: center;
    background: rgba(0,0,0,0.55); border: 1px solid rgba(239,83,80,0.4);
    border-radius: 16px; padding: 32px 24px;
  }
  .err-card .ico { font-size: 44px; margin-bottom: 12px; }
  .err-card .msg { font-size: 15px; color: #90CAF9; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="avatar" id="avatar"></div>
    <h1 id="nombre"></h1>
    <p class="sub" id="sub"></p>
    <div id="btns"></div>
    <p class="foot">Escanéame y elige cómo contactarme 😉</p>
  </div>
  <div class="err-card" id="err" style="display:none">
    <div class="ico">😕</div>
    <div class="msg"></div>
  </div>
  <script src="/u.js"></script>
</body>
</html>
